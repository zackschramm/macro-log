
[functions.ai-proxy]
enabled = true
verify_jwt = true
import_map = "./functions/ai-proxy/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/ai-proxy/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/ai-proxy/*.html" ]

# RevenueCat calls this with a shared secret in the Authorization header, not a
# Supabase JWT — verify_jwt MUST stay false or every event 401s at the gateway
# before our own check runs. Auth is RC_WEBHOOK_AUTH (see index.ts header).
[functions.revenuecat-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/revenuecat-webhook/index.ts"
